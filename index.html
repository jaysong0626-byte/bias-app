<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BIAS — 글로벌 K-팝 뉴스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>
<style>
:root{
  --bg:#fff;--bg2:#f7f7f8;--tx:#1a1a1a;--tx2:#6b7280;--bd:#e5e7eb;
  --r:8px;--rl:12px;
  --font:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
@media(prefers-color-scheme:dark){:root{--bg:#18181b;--bg2:#27272a;--tx:#fafafa;--tx2:#a1a1aa;--bd:#3f3f46;}}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 20% 0%,#fce7f3 0%,transparent 40%),
             radial-gradient(circle at 80% 100%,#ede9fe 0%,transparent 40%),#fafafa;}
@media(prefers-color-scheme:dark){html,body{background:radial-gradient(circle at 20% 0%,#4a1d3f 0%,transparent 40%),radial-gradient(circle at 80% 100%,#2a1f47 0%,transparent 40%),#09090b;}}
body{display:flex;align-items:center;justify-content:center;padding:20px;}

.phone{width:360px;background:var(--bg);border:.5px solid var(--bd);border-radius:32px;overflow:hidden;
  display:flex;flex-direction:column;height:680px;position:relative;
  box-shadow:0 30px 80px rgba(244,114,182,.18),0 10px 30px rgba(0,0,0,.12);}
.sbar{background:var(--bg);color:var(--tx);padding:10px 20px 8px;display:flex;
  justify-content:space-between;align-items:center;font-size:12px;font-weight:500;flex-shrink:0;}
.ca{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.sa{overflow-y:auto;flex:1;min-height:0;scrollbar-width:none;}
.sa::-webkit-scrollbar{display:none;}
.bnav{display:flex;background:var(--bg);border-top:.5px solid var(--bd);flex-shrink:0;}
.nbtn{flex:1;padding:10px 0 8px;text-align:center;font-size:22px;cursor:pointer;border:none;background:none;color:var(--tx2);transition:color .15s;}
.nbtn.active{color:#F472B6;}
.scr{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
.scr.active{display:flex;}

/* 온보딩 */
.ob-hero{background:linear-gradient(135deg,#F472B6,#A855F7);padding:22px 16px 18px;flex-shrink:0;}
.ob-hero h1{font-size:26px;font-weight:700;color:#fff;letter-spacing:1px;}
.ob-hero p{font-size:12px;color:rgba(255,255,255,.9);margin-top:3px;}
.lbl-xs{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.lbtn{padding:10px 12px;border-radius:var(--r);border:.5px solid var(--bd);background:var(--bg);
  font-size:13px;cursor:pointer;color:var(--tx);font-family:var(--font);transition:all .15s;}
.lbtn:hover{border-color:#F9A8D4;}
.lbtn.sel{border-color:#F472B6;background:#FDF2F8;color:#9D174D;}
.sw{display:flex;align-items:center;gap:8px;background:var(--bg2);border:.5px solid var(--bd);
  border-radius:var(--rl);padding:9px 12px;transition:border-color .15s;}
.sw:focus-within{border-color:#F472B6;}
.sw input{flex:1;border:none;background:none;outline:none;font-family:var(--font);font-size:13px;color:var(--tx);}
.sw input::placeholder{color:var(--tx2);}
.sbox{margin-top:6px;max-height:170px;overflow-y:auto;border:.5px solid var(--bd);border-radius:var(--r);background:var(--bg);}
.sui{padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;
  border-bottom:.5px solid var(--bd);transition:background .1s;font-size:13px;color:var(--tx);}
.sui:last-child{border-bottom:none;}
.sui:hover{background:#FDF2F8;}
.sui.nr{color:#9D174D;font-weight:500;}
.sm2{font-size:11px;color:var(--tx2);margin-left:auto;}
.tc{display:inline-flex;align-items:center;gap:5px;background:#FDF2F8;border:.5px solid #F9A8D4;
  border-radius:20px;padding:5px 6px 5px 12px;font-size:12px;color:#9D174D;font-family:var(--font);
  animation:pop .2s cubic-bezier(.16,1,.3,1);}
@keyframes pop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.tx-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:50%;background:rgba(157,23,77,.1);cursor:pointer;font-size:11px;}
.tx-x:hover{background:rgba(157,23,77,.2);}
.nb{font-size:9px;background:#F472B6;color:#fff;padding:1px 5px;border-radius:20px;}
.pt{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border:.5px solid var(--bd);
  border-radius:20px;padding:5px 12px;font-size:12px;color:var(--tx2);cursor:pointer;
  font-family:var(--font);transition:all .15s;}
.pt:hover{border-color:#F9A8D4;color:#9D174D;}
.pt.on{background:#FDF2F8;border-color:#F9A8D4;color:#9D174D;}
.done-btn{width:100%;padding:14px;background:#F472B6;color:#fff;border:none;border-radius:var(--rl);
  font-size:15px;font-weight:500;cursor:pointer;margin-top:16px;font-family:var(--font);
  display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s;}
.done-btn:hover{background:#EC4899;}
.done-btn:disabled{background:var(--bd);cursor:not-allowed;}

/* 피드 */
.ftop{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:.5px solid var(--bd);flex-shrink:0;}
.brand{font-size:20px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,#F472B6,#A855F7);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.live-dot{font-size:9px;padding:2px 6px;border-radius:4px;background:#ECFDF5;color:#047857;
  display:inline-flex;align-items:center;gap:3px;}
.live-dot::before{content:'●';font-size:7px;animation:pulse 1.5s ease-in-out infinite;}
.rbtn{background:none;border:none;cursor:pointer;color:var(--tx2);font-size:18px;
  display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
  border-radius:50%;transition:background .15s;}
.rbtn:hover{background:var(--bg2);color:#F472B6;}
.rbtn.sp i{animation:spin .8s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.frow{display:flex;gap:8px;padding:10px 12px 8px;overflow-x:auto;flex-shrink:0;
  border-bottom:.5px solid var(--bd);scrollbar-width:none;}
.frow::-webkit-scrollbar{display:none;}
.fc{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;
  border:.5px solid var(--bd);background:var(--bg);color:var(--tx2);transition:all .15s;}
.fc.active{background:#F472B6;color:#fff;border-color:#F472B6;}

/* 포스트 */
.post{border-bottom:.5px solid var(--bd);}
.phdr{display:flex;align-items:center;gap:10px;padding:10px 12px;}
.av{width:34px;height:34px;border-radius:50%;border:1.5px solid #F472B6;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
  color:#9D174D;flex-shrink:0;background:#FDF2F8;}
.piw{width:100%;aspect-ratio:4/3;position:relative;overflow:hidden;cursor:pointer;background:var(--bg2);}
.piw img{width:100%;height:100%;object-fit:cover;transition:opacity .4s,transform .6s;opacity:0;}
.piw img.ld{opacity:1;}
.piw:hover img.ld{transform:scale(1.03);}
.fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:700;color:rgba(255,255,255,.9);text-shadow:0 2px 8px rgba(0,0,0,.15);}
.fb.g1{background:linear-gradient(135deg,#fce4ec,#f8bbd0);color:#9D174D;}
.fb.g2{background:linear-gradient(135deg,#ede7f6,#d1c4e9);color:#4527A0;}
.fb.g3{background:linear-gradient(135deg,#e8eaf6,#c5cae9);color:#1A237E;}
.fb.g4{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:#E65100;}
.fb.g5{background:linear-gradient(135deg,#e0f7fa,#b2ebf2);color:#006064;}
.fb.g6{background:linear-gradient(135deg,#f3e5f5,#e1bee7);color:#4A148C;}
.ptag{display:inline-block;background:#F472B6;color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;margin-bottom:5px;}
.ptag.tr{background:linear-gradient(135deg,#F472B6,#A855F7);}
.pbody{padding:8px 12px 10px;}
.ptitle{font-size:14px;font-weight:500;color:var(--tx);line-height:1.45;margin-bottom:4px;}
.pdesc{font-size:12px;color:var(--tx2);line-height:1.55;display:-webkit-box;
  -webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pacts{display:flex;gap:14px;padding:2px 12px 8px;align-items:center;}
.pa{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--tx2);
  cursor:pointer;border:none;background:none;font-family:var(--font);}
.pa i{font-size:18px;}
.pa.liked i{color:#F472B6;}
.pa.liked span{color:#F472B6;}
/* 저장 버튼 */
.pa.saved i{color:#F59E0B;}
.pa.saved span{color:#F59E0B;}

/* 번역 중 표시 */
.tr-loading{display:flex;align-items:center;gap:6px;padding:8px 12px;
  font-size:11px;color:var(--tx2);}
.tr-loading i{font-size:13px;animation:spin .8s linear infinite;color:#A855F7;}

/* 스켈레톤 */
.sk-post{border-bottom:.5px solid var(--bd);padding-bottom:8px;}
.sh{background:linear-gradient(90deg,var(--bg2) 0%,#f0f0f0 50%,var(--bg2) 100%);
  background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}
@keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
.sk-av{width:34px;height:34px;border-radius:50%;}
.sk-h{display:flex;gap:10px;padding:10px 12px;align-items:center;}
.sk-img{width:100%;aspect-ratio:4/3;}
.sk-l1{width:80px;height:11px;border-radius:4px;margin-bottom:5px;}
.sk-l2{width:120px;height:9px;border-radius:4px;}
.sk-l3{width:88%;height:14px;border-radius:4px;margin:12px 12px 6px;}
.sk-l4{width:60%;height:11px;border-radius:4px;margin:0 12px 12px;}
.fload{display:flex;align-items:center;justify-content:center;padding:24px;gap:8px;}
.dot{width:6px;height:6px;border-radius:50%;background:#F472B6;animation:db 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.15s;}
.dot:nth-child(3){animation-delay:.3s;}
@keyframes db{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-6px);opacity:1;}}
.divider{padding:18px 16px 10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,transparent,#FDF2F8 60%,#FDF2F8);}
.divider .line{flex:1;height:.5px;background:#F9A8D4;}
.divider .lbl{font-size:11px;font-weight:600;color:#9D174D;letter-spacing:.6px;
  text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;}
.ferr{margin:12px;padding:14px;background:#FEF2F2;border:.5px solid #FCA5A5;
  border-radius:var(--r);font-size:12px;color:#991B1B;line-height:1.5;}
.ferr b{display:block;margin-bottom:4px;color:#7F1D1D;}
.ferr button{margin-top:8px;padding:6px 12px;background:#fff;border:.5px solid #FCA5A5;
  border-radius:6px;font-size:11px;color:#991B1B;cursor:pointer;font-family:var(--font);}
.fempty{padding:40px 20px;text-align:center;}
.fempty i{font-size:36px;color:var(--tx2);display:block;margin-bottom:10px;}
.fempty p{font-size:13px;color:var(--tx);font-weight:500;margin-bottom:6px;}
.fempty span{font-size:11px;color:var(--tx2);line-height:1.6;}

/* 랭킹 */
.rhdr{background:#F472B6;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rlive{background:rgba(255,255,255,.2);color:#fff;font-size:10px;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;}
.rlive i{font-size:8px;animation:pulse 1.5s ease-in-out infinite;}
.rflt{display:flex;gap:8px;padding:10px 12px;border-bottom:.5px solid var(--bd);flex-shrink:0;}
.rfbtn{flex:1;background:var(--bg2);border:.5px solid var(--bd);border-radius:20px;padding:5px 0;
  text-align:center;font-size:12px;color:var(--tx2);cursor:pointer;font-family:var(--font);}
.rfbtn.active{background:#FDF2F8;border-color:#F9A8D4;color:#9D174D;font-weight:500;}
.ri{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid var(--bd);}
.ri.t1{background:#FDF2F8;}
.rn{font-size:16px;font-weight:500;width:22px;text-align:center;color:var(--tx2);}
.rn.gold{color:#F59E0B;}.rn.silver{color:#9CA3AF;}.rn.bronze{color:#CD7C2F;}
.rav{width:38px;height:38px;border-radius:50%;background:#FDF2F8;border:.5px solid #F9A8D4;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#9D174D;flex-shrink:0;}
.rinf{flex:1;}
.rnm{font-size:13px;font-weight:500;color:var(--tx);}
.rsc{font-size:11px;color:var(--tx2);}
.rbg{background:var(--bg2);border-radius:4px;height:4px;margin-top:4px;width:72px;}
.rbf{background:#F472B6;border-radius:4px;height:4px;transition:width .6s ease;}
.rch{font-size:11px;min-width:30px;text-align:right;}
.rup{color:#10B981;}.rdown{color:#EF4444;}.rsame{color:var(--tx2);}
.rank-notice{margin:10px 12px;padding:10px 12px;background:#FEF3C7;border:.5px solid #FCD34D;
  border-radius:var(--r);font-size:11px;color:#92400E;line-height:1.5;display:flex;align-items:flex-start;gap:8px;}
.rank-notice i{font-size:14px;flex-shrink:0;margin-top:1px;}

/* 검색 */
.stop{padding:12px 14px;border-bottom:.5px solid var(--bd);flex-shrink:0;}
.siw{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:var(--rl);padding:9px 12px;}
.siw input{flex:1;border:none;background:none;font-size:14px;color:var(--tx);outline:none;font-family:var(--font);}
.siw input::placeholder{color:var(--tx2);}
.sni{display:flex;gap:10px;padding:10px 14px;border-bottom:.5px solid var(--bd);cursor:pointer;transition:background .1s;}
.sni:hover{background:var(--bg2);}
.snt{width:64px;height:64px;border-radius:var(--r);flex-shrink:0;overflow:hidden;background:var(--bg2);
  display:flex;align-items:center;justify-content:center;}
.snt img{width:100%;height:100%;object-fit:cover;}
.snt .fb2{font-size:18px;font-weight:700;color:#9D174D;}

/* 스케줄 */
.shdr{background:#F472B6;padding:14px 16px;flex-shrink:0;}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:.5px solid var(--bd);flex-shrink:0;}
.mb{background:none;border:.5px solid var(--bd);border-radius:var(--r);padding:4px 10px;font-size:12px;color:var(--tx2);cursor:pointer;font-family:var(--font);}
.sfr{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;border-bottom:.5px solid var(--bd);flex-shrink:0;scrollbar-width:none;}
.sfr::-webkit-scrollbar{display:none;}
.sch{flex-shrink:0;padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:.5px solid var(--bd);background:var(--bg);color:var(--tx2);}
.sch.active{background:#F472B6;color:#fff;border-color:#F472B6;}
.sday{padding:10px 16px 4px;font-size:12px;font-weight:500;color:var(--tx2);}
.sit{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:.5px solid var(--bd);cursor:pointer;transition:background .15s;}
.sit:hover{background:var(--bg2);}
.sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.scon{flex:1;min-width:0;}
.sbadge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;margin-bottom:4px;font-weight:500;}
.bc{background:#FDF2F8;color:#9D174D;}.bn{background:#EDE7F6;color:#4527A0;}
.bf{background:#E0F7FA;color:#006064;}.ba{background:#FFF8E1;color:#E65100;}
.snm{font-size:13px;font-weight:500;color:var(--tx);line-height:1.4;}
.sdt{font-size:11px;color:var(--tx2);margin-top:2px;}
.ssc{font-size:10px;color:#F472B6;margin-top:3px;}
.sadd{background:none;border:.5px solid var(--bd);border-radius:50%;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--tx2);transition:all .15s;font-family:var(--font);}
.sadd:hover{border-color:#F472B6;color:#F472B6;background:#FDF2F8;}
.sadd.on{border-color:#10B981;color:#10B981;background:#ECFDF5;}
.csb{margin:10px 12px;padding:10px 14px;border-radius:var(--rl);background:#FDF2F8;border:.5px solid #F9A8D4;display:flex;align-items:center;gap:10px;cursor:pointer;}

/* 시트 */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:99;animation:fi .2s ease-out;}
@keyframes fi{from{opacity:0;}to{opacity:1;}}
.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-radius:20px 20px 0 0;
  border-top:.5px solid var(--bd);z-index:100;display:flex;flex-direction:column;
  animation:su .3s cubic-bezier(.16,1,.3,1);max-height:92%;overflow-y:auto;padding-bottom:8px;}
@keyframes su{from{transform:translateY(100%);}to{transform:translateY(0);}}
.shdl{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.shh{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;}
.shc{background:none;border:none;font-size:20px;color:var(--tx2);cursor:pointer;}
.sht{font-size:15px;font-weight:600;color:var(--tx);}
.shsub{font-size:16px;font-weight:600;color:var(--tx);line-height:1.35;padding:8px 18px 4px;}
.shb{padding:4px 18px 14px;}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid var(--bd);}
.mrow:first-of-type{border-top:none;}
.mic{width:32px;height:32px;border-radius:8px;background:#FDF2F8;color:#F472B6;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.ml{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;}
.mv{font-size:13px;color:var(--tx);margin-top:1px;word-break:break-word;}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:6px 18px 0;}
.ssbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:var(--r);
  border:.5px solid var(--bd);background:var(--bg);font-size:12px;font-weight:500;color:var(--tx);
  cursor:pointer;font-family:var(--font);transition:all .15s;}
.ssbtn:hover{border-color:#F472B6;background:#FDF2F8;}
.ssbtn i{font-size:16px;color:#F472B6;}
.ssbtn.p{background:#F472B6;color:#fff;border-color:#F472B6;grid-column:1/-1;}
.ssbtn.p i{color:#fff;}
.ssbtn.p:hover{background:#EC4899;}
.shnote{padding:10px 18px 4px;font-size:11px;color:var(--tx2);line-height:1.5;}

/* 알림 설정 시트 */
.notif-section{padding:12px 18px 6px;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.notif-row{display:flex;align-items:center;padding:12px 18px;border-bottom:.5px solid var(--bd);gap:12px;}
.notif-row:last-child{border-bottom:none;}
.notif-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.notif-info{flex:1;}
.notif-title{font-size:13px;font-weight:500;color:var(--tx);}
.notif-desc{font-size:11px;color:var(--tx2);margin-top:2px;line-height:1.4;}
/* 토글 스위치 */
.toggle{position:relative;width:42px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-track{position:absolute;inset:0;border-radius:12px;background:var(--bd);cursor:pointer;transition:background .2s;}
.toggle input:checked + .toggle-track{background:#F472B6;}
.toggle-thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .2s;pointer-events:none;}
.toggle input:checked ~ .toggle-thumb{transform:translateX(18px);}
/* 라디오 선택 */

.radio-opt.sel{border-color:#F472B6;background:#FDF2F8;}
.radio-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bd);flex-shrink:0;

.radio-opt.sel .radio-dot{border-color:#F472B6;background:#F472B6;}
.radio-opt.sel .radio-dot::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff;}

.pav{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);

  setTimeout(()=>t.style.opacity='0',1800);
  setTimeout(()=>t.remove(),2100);
}
function fmtN(n){return n>=1000?(n/1000).toFixed(1)+'K':String(n);}
function ago(d){
  if(!d) return '';
  const s=(Date.now()-d.getTime())/1000;
  if(s<60) return '방금 전';
  if(s<3600) return `${Math.floor(s/60)}분 전`;
  if(s<86400) return `${Math.floor(s/3600)}시간 전`;
  if(s<604800) return `${Math.floor(s/86400)}일 전`;
  return d.toLocaleDateString('ko-KR');
}
function hashG(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return(Math.abs(h)%6)+1;}

// ═══════════════════════════════════════════════
//  번역 — 핵심 수정: 항상 원문 언어 감지 후 번역
// ═══════════════════════════════════════════════
function isKorean(text) { return /[가-힣]/.test(text); }
function isEnglish(text) { return /^[a-zA-Z0-9\s\p{P}'"''""\-\u2013\u2014…]+$/u.test(text.trim()); }

function needsTranslation(text) {
  if (!text) return false;
  // 한국어 목표 → 영어/기타 외국어면 번역 필요
  if (S.lang === 'ko') return !isKorean(text) && text.length > 5;
  // 영어 목표 → 한국어면 번역 필요
  if (S.lang === 'en') return isKorean(text);
  // 그 외 언어 → 항상 번역
  return true;
}

async function translateText(text) {
  if (!text || text.length < 3) return text;
  if (!needsTranslation(text)) return text;

  const cacheKey = `${S.lang}::${text.slice(0, 120)}`;
  if (S.trCache[cacheKey]) return S.trCache[cacheKey];

  const target = LANG_TARGET[S.lang] || '한국어';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        system: `Translate the following text to ${target}. Output ONLY the translated text. No explanation, no quotes, no preamble. Keep proper nouns (names of K-pop groups, artists) as-is.`,
        messages: [{role:'user', content: text}],
      })
    });
    if (!res.ok) throw new Error(`API ${res.status}`);
    const d = await res.json();
    const out = d.content?.[0]?.text?.trim() || text;
    S.trCache[cacheKey] = out;
    return out;
  } catch(e) {
    console.warn('[BIAS] 번역 실패:', e.message);
    return text;
  }
}

async function translateBatch(arts) {
  // 번역이 필요한 것만 골라서 처리 (5개 단위 병렬)
  const results = [];
  for (let i = 0; i < arts.length; i += 5) {
    const batch = arts.slice(i, i+5);
    const done = await Promise.all(batch.map(async a => {
      const titleNeedsTr = needsTranslation(a.title);
      const descNeedsTr  = needsTranslation(a.desc);
      const [titleTr, descTr] = await Promise.all([
        titleNeedsTr ? translateText(a.title) : Promise.resolve(a.title),
        descNeedsTr  ? translateText(a.desc)  : Promise.resolve(a.desc),
      ]);
      return {...a, titleTr, descTr};
    }));
    results.push(...done);
  }
  return results;
}

async function proxyFetch(url){
  let last;
  for(const mk of PROXIES){
    const pu=mk(url);
    try{
      const r=await fetch(pu, {signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      if(pu.includes('allorigins')){const d=await r.json();if(!d.contents) throw new Error('empty');return d.contents;}
      return await r.text();
    }catch(e){last=e;}
  }
  throw last;
}
function strip(h){return(h||'').replace(/<[^>]+>/g,'').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();}

function getImg(item,html){
  for(const tag of ['media:content','media:thumbnail']){
    for(const el of item.getElementsByTagName(tag)){
      const u=el.getAttribute('url');
      if(u&&u.startsWith('http')) return u;
    }
  }
  for(const el of item.getElementsByTagName('enclosure')){
    const t=el.getAttribute('type')||'',u=el.getAttribute('url')||'';
    if(u&&(t.startsWith('image/')||/\.(jpe?g|png|webp|gif)/i.test(u))) return u;
  }
  const ce=item.getElementsByTagName('content:encoded')[0]?.textContent||'';
  const m1=ce.match(/<img[^>]+src=["']([^"']+)["']/i);if(m1) return m1[1];
  const m2=(html||'').match(/<img[^>]+src=["']([^"']+)["']/i);if(m2) return m2[1];
  return null;
}

function parseRSS(xml,src){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('XML parse error');
  let items=doc.getElementsByTagName('item'); let atom=false;
  if(!items.length){items=doc.getElementsByTagName('entry');atom=true;}
  const arts=[];
  for(const it of items){
    const title=strip(it.getElementsByTagName('title')[0]?.textContent||'');
    let link='';
    if(atom) link=it.querySelector('link')?.getAttribute('href')||'';
    else link=strip(it.getElementsByTagName('link')[0]?.textContent||'');
    const pd=it.getElementsByTagName('pubDate')[0]?.textContent||it.getElementsByTagName('published')[0]?.textContent;
    const desc=it.getElementsByTagName('description')[0]?.textContent||it.getElementsByTagName('summary')[0]?.textContent||'';
    const imageUrl=getImg(it,desc);
    if(title) arts.push({
      id:`${src.id}::${(link||title).slice(0,180)}`,
      src,title,desc:strip(desc).slice(0,200),link,imageUrl,
      pubDate:pd?new Date(pd):null,
      idol:null,titleTr:null,descTr:null,
    });
  }
  return arts;
}

async function fetchSrc(src){
  try{const xml=await proxyFetch(src.url);return{ok:true,arts:parseRSS(xml,src)};}
  catch(e){console.warn(`[BIAS] ${src.name} 실패:`,e.message);return{ok:false,err:e.message,src};}
}

async function fetchAll(){
  S.fetched=0;S.failed=[];
  const results=await Promise.all(SOURCES.map(fetchSrc));
  const all=[],seen=new Set();
  results.forEach(r=>{
    if(r.ok){S.fetched++;r.arts.forEach(a=>{const k=a.link||a.title;if(!seen.has(k)){seen.add(k);all.push(a);}});}
    else S.failed.push({name:r.src.name,err:r.err});
  });
  all.sort((a,b)=>(b.pubDate?.getTime()??0)-(a.pubDate?.getTime()??0));
  S.allArts=all;
}

function getTerms(name){
  const f=IDOL_DB.find(x=>x.name.toLowerCase()===name.toLowerCase());
  return f?[f.name,...f.alt]:[name];
}
function matches(a,name){
  const hay=(a.title+' '+a.desc).toLowerCase();
  return getTerms(name).some(t=>t.length>=2&&hay.includes(t.toLowerCase()));
}
const KPOP_RE=/K-?POP|아이돌|걸그룹|보이그룹|컴백|미니앨범|정규앨범|타이틀곡|팬미팅|데뷔|공연|투어|콘서트|시상식/i;

function categorize(){
  const filterIdols=S.activeFilter==='전체'?S.idols:S.idols.filter(i=>i.name===S.activeFilter);
  const p=[],t=[];
  for(const a of S.allArts){
    let matched=null;
    for(const idol of filterIdols){if(matches(a,idol.name)){matched=idol.name;break;}}
    if(matched) p.push({...a,idol:matched});
    else if(KPOP_RE.test(a.title+a.desc)||['soompi','allkpop','koreaboo'].includes(a.src.id)) t.push(a);
  }
  S.personal=p; S.trending=t;
}

let searchDebounce=null;
function onSrch(val){
  clearTimeout(searchDebounce);
  searchDebounce=setTimeout(()=>doSrch(val),300);
}

async function doSrch(val){
  const q=val.trim().toLowerCase();
  const box=document.getElementById('searchBox');
  if(!q){renderDfltSrch();return;}

  // ★ 핵심: 모든 소스 기사에서 아이돌 이름/키워드로 검색, 최신순
  const searchTerms=getTerms(val.trim()); // 아이돌 DB에서 별명까지 포함
  const hits=S.allArts.filter(a=>{
    const hay=(a.title+' '+a.desc+' '+(a.titleTr||'')+' '+(a.descTr||'')).toLowerCase();
    // 입력값 자체로도 검색, 아이돌 별명으로도 검색
    return hay.includes(q)||searchTerms.some(t=>t.length>=2&&hay.includes(t.toLowerCase()));
  }); // 이미 최신순 정렬됨 (fetchAll에서 sort)

  if(!hits.length){
    box.innerHTML=`<div style="padding:40px 20px;text-align:center;">
      <i class="ti ti-music-off" style="font-size:40px;color:var(--tx2);display:block;margin-bottom:12px;"></i>
      <div style="font-size:14px;font-weight:500;color:var(--tx);margin-bottom:6px;">"${esc(val)}" 관련 기사가 없어요</div>
      <div style="font-size:12px;color:var(--tx2);line-height:1.6;">피드를 새로고침하거나 다른 키워드로 시도해보세요.</div>
    </div>`;
    return;
  }

  // 번역 필요 기사 처리 (아직 번역 안 된 것들)
  const needTr=hits.filter(h=>needsTranslation(h.title)&&!h.titleTr).slice(0,20);
  if(needTr.length){
    box.innerHTML=`<div style="padding:16px;text-align:center;font-size:12px;color:var(--tx2);">
      <i class="ti ti-language" style="animation:spin .8s linear infinite;margin-right:4px;"></i> 번역 중... (${hits.length}건)</div>`;
    const translated=await translateBatch(needTr);
    translated.forEach(t=>{const ai=S.allArts.findIndex(a=>a.id===t.id);if(ai>=0) S.allArts[ai]=t;});
  }
  // 최종 표시 (번역 반영된 버전)
  const final=hits.map(h=>S.allArts.find(a=>a.id===h.id)||h);

  let html=`<div style="padding:12px 14px 4px;font-size:12px;font-weight:500;color:var(--tx2);">"${esc(val)}" — 최신순 ${final.length}건 / 전체 ${S.allArts.length}건</div>`;
  final.forEach(a=>{
    const g=hashG(a.id);const init=a.src.av;
    const dispTitle=a.titleTr||a.title;
    const isSaved=S.saved.has(a.id);
    const thumb=a.imageUrl
      ?`<div class="snt"><img src="${esc(a.imageUrl)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;fb2&quot;>${esc(init)}</div>'"></div>`
      :`<div class="snt"><div class="fb2">${esc(init)}</div></div>`;
    html+=`<div class="sni">
      <div onclick="openArt('${esc(a.link)}','${esc(a.id)}')" style="display:flex;gap:10px;flex:1;min-width:0;">
        ${thumb}
        <div style="flex:1;min-width:0;">
          <div style="margin-bottom:3px;"><span style="background:${a.src.col};color:#fff;font-size:10px;padding:2px 7px;border-radius:20px;">${esc(a.src.name)}</span></div>
          <div style="font-size:13px;font-weight:500;color:var(--tx);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(dispTitle)}</div>
          <div style="font-size:11px;color:var(--tx2);margin-top:4px;">${ago(a.pubDate)}</div>
        </div>
      </div>
      <button class="pa ${isSaved?'saved':''}" onclick="togSave(this,'${esc(a.id)}')" style="flex-shrink:0;padding:4px;">
        <i class="ti ${isSaved?'ti-star-filled':'ti-star'}" style="font-size:16px;"></i>
      </button>
    </div>`;
  });
  box.innerHTML=html;
}

        <div class="ssc">${esc(s.sc)}</div></div>
      <button class="sadd${added?' on':''}" onclick="event.stopPropagation();quickSched('${s.id}',this)">
        <i class="ti ${added?'ti-calendar-check':'ti-calendar-plus'}"></i></button>
    </div>`;
  });
  box.innerHTML=html;
}
function selSF(c){c.parentElement.querySelectorAll('.sch').forEach(x=>x.classList.remove('active'));c.classList.add('active');}
function openSD(id){
  const s=SCHED.find(x=>x.id===id);if(!s) return;
  clSheet();
  const ph=document.getElementById('phone');
  const ov=document.createElement('div');ov.className='overlay';ov.onclick=clSheet;
  const sh=document.createElement('div');sh.className='sheet';
  const sd=new Date(s.start),ed=new Date(s.end);
  const dStr=sd.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const tStr=`${sd.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} - ${ed.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`;
  sh.innerHTML=`<div class="shdl"></div>
    <div class="shh"><span class="sbadge ${s.badge}">${s.bl}</span><button class="shc" onclick="clSheet()"><i class="ti ti-x"></i></button></div>
    <div class="shsub">${esc(s.name)}</div>
    <div class="shb">
      <div class="mrow"><div class="mic"><i class="ti ti-calendar"></i></div><div><div class="ml">날짜</div><div class="mv">${dStr}</div></div></div>
      <div class="mrow"><div class="mic"><i class="ti ti-clock"></i></div><div><div class="ml">시간 (${esc(s.tz)})</div><div class="mv">${tStr}</div></div></div>
      <div class="mrow"><div class="mic"><i class="ti ti-map-pin"></i></div><div><div class="ml">장소</div><div class="mv">${esc(s.loc)}</div></div></div>
      <div class="mrow"><div class="mic"><i class="ti ti-info-circle"></i></div><div><div class="ml">출처</div><div class="mv">${esc(s.sc)}</div></div></div>
    </div>
    <div style="padding:0 18px 6px;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;">캘린더에 추가</div>
    <div class="sgrid">
      <button class="ssbtn p" onclick="dlICS('${s.id}')"><i class="ti ti-calendar-plus"></i> 내 캘린더 저장 (.ics)</button>
      <button class="ssbtn" onclick="openGcal('${s.id}')"><i class="ti ti-brand-google"></i> Google 캘린더</button>
      <button class="ssbtn" onclick="cpyEvt('${s.id}')"><i class="ti ti-link"></i> 정보 복사</button>
    </div>
    <div class="shnote"><i class="ti ti-info-circle" style="font-size:12px;"></i> .ics는 iPhone, Android, Outlook 등 거의 모든 캘린더 앱에서 열 수 있어요.</div>`;
  ph.appendChild(ov);ph.appendChild(sh);
}
function quickSched(id,btn){dlICS(id);S.addedSched.add(id);btn.classList.add('on');btn.innerHTML='<i class="ti ti-calendar-check"></i>';}
function icsDate(iso){const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}T${p(d.getUTCHours())}${p(d.getUTCMinutes())}${p(d.getUTCSeconds())}Z`;}
function icsE(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function buildICS(s){
  const now=new Date(),p=n=>String(n).padStart(2,'0');
  const stamp=`${now.getUTCFullYear()}${p(now.getUTCMonth()+1)}${p(now.getUTCDate())}T${p(now.getUTCHours())}${p(now.getUTCMinutes())}${p(now.getUTCSeconds())}Z`;
  return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BIAS//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT',`UID:${s.id}-${Date.now()}@bias.app`,`DTSTAMP:${stamp}`,
    `DTSTART:${icsDate(s.start)}`,`DTEND:${icsDate(s.end)}`,
    `SUMMARY:${icsE(s.name)}`,`LOCATION:${icsE(s.loc)}`,
    `DESCRIPTION:${icsE(s.desc+'\\n\\n출처: '+s.sc+'\\n공유: BIAS 앱')}`,
    'BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY',`DESCRIPTION:${icsE(s.name)} 1시간 전`,'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function dlICS(id){
  const s=SCHED.find(x=>x.id===id);if(!s) return;
  const blob=new Blob([buildICS(s)],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`${s.name.replace(/[^\w가-힣 ]/g,'')}.ics`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  S.addedSched.add(id);toast('내 캘린더에 추가됐어요','ti-calendar-check');renderSched();
}
function openGcal(id){
  const s=SCHED.find(x=>x.id===id);if(!s) return;
  window.open(`https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(s.name)}&dates=${icsDate(s.start)}/${icsDate(s.end)}&details=${encodeURIComponent(s.desc+'\n\n출처: '+s.sc)}&location=${encodeURIComponent(s.loc)}`,'_blank');
  toast('Google 캘린더로 이동합니다','ti-external-link');
}
function cpyEvt(id){
  const s=SCHED.find(x=>x.id===id);if(!s) return;
  const sd=new Date(s.start);
  const txt=`📅 ${s.name}\n🗓 ${sd.toLocaleDateString('ko-KR')}\n⏰ ${s.detail}\n📍 ${s.loc}\n\n(BIAS 앱에서 공유)`;
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(()=>toast('복사됐어요','ti-clipboard-check'),()=>fbCopy(txt));
  else fbCopy(txt);
}
function fbCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='absolute';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('복사됐어요','ti-clipboard-check');}catch{toast('복사 실패','ti-x');}
  document.body.removeChild(ta);
}

// ═══════════════════════════════════════════════
//  탭 네비게이션

function goTab(tab){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('scr-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='rank') buildRank();
  if(tab==='sched') renderSched();
  if(tab==='profile') renderProf();
  if(tab==='search') renderDfltSrch();
}

//  앱 시작

async function startApp(){
  if(!S.idols.length) return;
  document.getElementById('ob').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('langLabel').textContent=S.langName;
  renderFilters();buildRank();renderSched();renderProf();renderDfltSrch();
  document.getElementById('feedBox').innerHTML=skels(3);
  await doRefresh();
}
